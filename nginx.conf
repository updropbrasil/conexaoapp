# Conexão Vendas — site estático (pasta out/ do Next.js) servido pelo nginx do container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml text/xml;

    # JS/CSS/fontes do Next têm hash no nome → cache de 1 ano
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # service worker e manifest: sempre a versão nova
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # ícones
    location ~* \.(?:png|ico|webp|jpg|jpeg|svg)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # páginas: /produto/ → /produto/index.html; rota desconhecida → catálogo. HTML nunca fica velho.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ $uri.html /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
